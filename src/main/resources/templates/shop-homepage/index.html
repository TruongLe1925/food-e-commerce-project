<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Shop Homepage - Start Bootstrap Template</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="/css/index.css" rel="stylesheet" />
        <script src="https://unpkg.com/htmx.org@1.9.10"></script>
        <style>
                        /* CSS cho thẻ Card sản phẩm */
            .card {
                border: 1px solid #e0e0e0; /* Thêm viền màu xám nhạt */
                border-radius: 8px;        /* Bo góc nhẹ cho hiện đại */
                overflow: hidden;          /* Để ảnh không đè lên góc bo của card */
                transition: all 0.3s ease; /* Tạo hiệu ứng mượt khi hover */
                background-color: #fff;
            }

            /* Hiệu ứng khi di chuột vào */
            .card:hover {
                border-color: #ffc107;     /* Đổi viền sang màu vàng khi hover */
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); /* Đổ bóng nhẹ phía dưới */
                transform: translateY(-5px); /* Nhích nhẹ lên trên một chút */
            }

            /* Tinh chỉnh ảnh sản phẩm */
            .product-img-fixed {
                width: 100%;
                height: 200px;             /* Chiều cao cố định */
                object-fit: cover;         /* Giữ tỉ lệ ảnh không bị méo */
                border-bottom: 1px solid #eee; /* Đường kẻ mảnh giữa ảnh và tên sản phẩm */
            }
        </style>
    </head>
    <body>
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand" th:href="@{/}">Start Bootstrap</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="#!">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#!">About</a></li>
<!--                        <li class="nav-item dropdown">-->
<!--                            <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Shop</a>-->
<!--                            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">-->
<!--                                <li><a class="dropdown-item" href="#!">All Products</a></li>-->
<!--                                <li><hr class="dropdown-divider" /></li>-->
<!--                                <li><a class="dropdown-item" href="#!">Popular Items</a></li>-->
<!--                                <li><a class="dropdown-item" href="#!">New Arrivals</a></li>-->
<!--                            </ul>-->
<!--                        </li>-->
                    </ul>
                    <form class="d-flex">
                        <div sec:authorize="hasRole('CUSTOMER')">
                            <a th:href="@{/cart/showCart}"  class="btn btn-outline-dark">
                                <i class="bi-cart-fill me-1"></i>
                                Cart
                            </a>
                        </div>
                        <div sec:authorize="hasRole('CUSTOMER')">
                            <p>
                                <a class="btn btn-outline-dark ms-2" href="#profile" th:href="@{/cus/customerdetail}" ><i class="bi-person-fill"></i></a>
                            </p>
                        </div>
                        <div sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/admin/dashboard}" class="btn btn-outline-danger ms-2">
                                <i class="bi bi-shield-lock"></i> Admin Panel
                            </a>
                        </div>

                        <div sec:authorize="hasRole('MANAGER')">
                            <a th:href="@{/manager/orders}" class="btn btn-outline-info ms-2">
                                <i class="bi bi-kanban"></i> Manager Portal
                            </a>
                        </div>
                        <a href="http://localhost:8080/swagger-ui/index.html" class="btn btn-outline-success ms-2" target="_blank">
                            <i class="bi bi-braces"></i> Swagger API
                        </a>
                        <div sec:authorize="isAnonymous()" class="d-flex align-items-center">
                            <p class="mb-0">
                                <a class="btn btn-outline-dark ms-2" th:href="@{/account/login}">
                                    <i class="bi-box-arrow-in-right"></i> Login
                                </a>
                            </p>
                            <p class="mb-0">
                                <a class="btn btn-outline-dark ms-2" th:href="@{/account/register}" target="_blank">
                                    <i class="bi bi-person-plus"></i> Register
                                </a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </nav>
        <!-- Header-->
        <header class="position-relative overflow-hidden py-5" style="min-height: 400px;">
            <img th:src="@{|/images/banner/${bannerDTO.imageUrl}|}"
                 class="position-absolute top-0 start-0 w-100 h-100"
                 style="object-fit: cover; z-index: -1;"
                 alt="Banner">
            <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50" style="z-index: 0;"></div>

            <div class="container px-4 px-lg-5 my-5 position-relative" style="z-index: 1;">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder" th:text="${@shopConfig.shopName}">Shop in style</h1>
                    <p class="lead fw-normal text-dark-50 mb-0" th:text="${@shopConfig.slogan}">With this shop homepage template</p>
                </div>
            </div>
        </header>
        <!-- Section-->
        <section class="py-5">
            <div class="container px-4 px-lg-5 mt-5">
                <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
                    <div class="col mb-5" th:each="product : ${product}">
                        <div class="card h-100">
                            <!-- Product image-->
                            <img class="card-img-top product-img-fixed" th:src="@{|/images/product/${product.imageUrl}|}" alt="..." />
                            <!-- Product details-->
                            <div class="card-body p-4">
                                <div class="text-center">
                                    <!-- Product name-->
                                    <h5 class="fw-bolder"th:text="${product.productName}"></h5>
                                    <!-- Product price-->
                                    <p th:text="${#numbers.formatDecimal(product.productPrice, 0, 'POINT', 0, 'COMMA')} + ' đ'"></p>
                                </div>
                            </div>
                            <!-- Product actions-->

                            <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                                <form sec:authorize="hasRole('CUSTOMER')"
                                      hx-post="/addToCart"
                                      hx-swap="none"
                                      method="POST"
                                      class="text-center">
                                    <input type="hidden" name="productName" th:value="${product.productName}" />
                                    <input type="hidden" name="quantity" th:value="1"/>
                                    <button type="submit" class="btn btn-outline-dark mt-auto">
                                        Add to Cart
                                    </button>
                                </form>

                                <div sec:authorize="isAnonymous()" class="text-center">
                                    <a th:href="@{/login}" class="btn btn-outline-primary mt-auto">
                                        Login to Buy
                                    </a>
                                </div>
                                <div sec:authorize="hasAnyRole('ADMIN', 'MANAGER')" class="text-center text-muted small">
                                    View Only Mode
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Footer-->
        <footer class="py-5 bg-dark">
            <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Your Website 2023</p></div>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d10330.764335109674!2d106.63727976624983!3d10.760938071130001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752e9ce16dc7bb%3A0x7f4948d13ef343fe!2zQuG7h25oIHZp4buHbiBDaHV5w6puIEtob2EgTmdv4bqhaSBUaOG6p24gS2luaCBRdeG7kWMgVOG6vw!5e0!3m2!1svi!2s!4v1772703907087!5m2!1svi!2s" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
        <script src="js/scripts.js"></script>
    </body>
</html>
