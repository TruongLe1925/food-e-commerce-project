<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .cart-item-img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
        .qty-input { max-width: 60px; text-align: center; border: none; background: transparent; }
        .card { border-radius: 15px; }
        .btn-checkout { background-color: #ff5e00; color: white; border: none; font-weight: 600; }
        .btn-checkout:hover { background-color: #e65500; color: white; }
    </style>
    <link href="/css/index.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
<div th:insert="~{layout :: header}"></div>
<div class="container py-5">
    <h2 class="fw-bold mb-4">Giỏ hàng của bạn</h2>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 p-3">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr class="text-muted small">
                            <th>SẢN PHẨM</th>
                            <th>SỐ LƯỢNG</th>
                            <th>GIÁ TIỀN</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${itemCarts.items}">
                            <td>
                                <div class="d-flex align-items-center">
                                    <img th:src="@{|/images/product/${item.imageUrl}|}" class="cart-item-img me-3" alt="food">
                                    <div>
                                        <h6 class="mb-0 fw-bold" th:text="${item.productName}"></h6>
                                        <p class="text-muted small mb-0" th:text="${item.description}">Cay vừa, giòn</p>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="d-flex align-items-center border rounded-pill px-2 py-1" style="width: fit-content;">
                                    <input th:value="${item.quantity}" class="qty-input" readonly>
                                </div>
                            </td>
                            <td><span class="fw-bold" th:text="${item.totalPrice}">45.000đ</span></td>
                            <form method="POST" th:action="@{/cart/delete}">
                                <td>
                                    <button type="button" class="btn btn-light btn-sm rounded-circle text-danger"
                                            data-bs-toggle="modal" data-bs-target="#confirmDeleteModal">×</button>
                                </td>
                                <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Xác nhận xóa</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                            </div>
                                            <div class="modal-body">
                                            </div>
                                            <div class="modal-footer">
                                                <input type="hidden" name="cartItemsId" th:value="${item.cartItemsId}">
                                                <button type="submit" class="btn btn-danger">Xóa</button>
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm border-0 p-4">
                <h5 class="fw-bold mb-4">Chi tiết thanh toán</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Tạm tính</span>
                    <span th:text="${itemCarts.cartTotalPrice}">165.000đ</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Vận chuyển</span>
                    <span class="text-success">Miễn phí</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-4">
                    <span class="fw-bold fs-5">Tổng cộng</span>
                    <span class="fw-bold fs-5 text-dark" th:text="${itemCarts.cartTotalPrice}">165.000đ</span>
                </div>
                <button class="btn btn-checkout btn-lg w-100 py-3">THANH TOÁN</button>
            </div>
        </div>
    </div>
</div>
<div class="mt-auto" th:insert="~{layout :: footer}"></div>
</body>
</html>
