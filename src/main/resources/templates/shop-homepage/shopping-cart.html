<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .cart-item-img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
        .qty-input { max-width: 60px; text-align: center; border: none; background: transparent; }
        .card { border-radius: 15px; }
        .btn-checkout { background-color: #ff5e00; color: white; border: none; font-weight: 600; }
        .btn-checkout:hover { background-color: #e65500; color: white; }
    </style>
</head>
<body>

<div class="container py-5">
    <h2 class="fw-bold mb-4">Giỏ hàng của bạn</h2>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 p-3">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr class="text-muted small">
                            <th>SẢN PHẨM</th>
                            <th>SỐ LƯỢNG</th>
                            <th>GIÁ TIỀN</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <img src="https://images.unsplash.com/photo-1562967914-608f82629710?w=200" class="cart-item-img me-3" alt="food">
                                    <div>
                                        <h6 class="mb-0 fw-bold">Gà Rán KFC Truyền Thống</h6>
                                        <p class="text-muted small mb-0">Cay vừa, giòn</p>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="d-flex align-items-center border rounded-pill px-2 py-1" style="width: fit-content;">
                                    <button class="btn btn-sm p-0 px-2">-</button>
                                    <input type="text" class="qty-input" value="1" readonly>
                                    <button class="btn btn-sm p-0 px-2">+</button>
                                </div>
                            </td>
                            <td><span class="fw-bold">45.000đ</span></td>
                            <td><button class="btn btn-light btn-sm rounded-circle text-danger">×</button></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm border-0 p-4">
                <h5 class="fw-bold mb-4">Chi tiết thanh toán</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Tạm tính</span>
                    <span>165.000đ</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Vận chuyển</span>
                    <span class="text-success">Miễn phí</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-4">
                    <span class="fw-bold fs-5">Tổng cộng</span>
                    <span class="fw-bold fs-5 text-dark">165.000đ</span>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold">GHI CHÚ ĐƠN HÀNG</label>
                    <textarea class="form-control" rows="2" placeholder="Ví dụ: Không hành..."></textarea>
                </div>

                <button class="btn btn-checkout btn-lg w-100 py-3">THANH TOÁN</button>

                <div class="mt-3 text-center">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" width="60" class="me-2" alt="paypal">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Visa.svg" width="40" alt="visa">
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
