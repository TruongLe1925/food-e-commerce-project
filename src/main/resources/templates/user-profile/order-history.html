<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>User Profile | FoodieDash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/userprofile.css" rel="stylesheet"/>
    <link href="/css/index.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
<div th:insert="~{layout :: header}"></div>
<header class="bg-dark py-5">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-white">
            <h1 class="display-4 fw-bolder">Shop in style</h1>
            <p class="lead fw-normal text-white-50 mb-0">With this shop hompeage template</p>
        </div>
    </div>
</header>
<div class="card border-0 shadow-sm p-4 mt-4">
    <h5 class="fw-bold mb-4">
        <i class="bi bi-clock-history text-primary"></i> Lịch sử đơn hàng
    </h5>
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Mã đơn</th>
                <th>Ngày đặt</th>
                <th>Note</th>
                <th>Trạng thái</th>
                <th>Chi tiết</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.orderId}">#ID</td>
                <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy')}"></td>
                <td th:text="${order.note}">Tổng tiền</td>
                <td>
                    <span th:text="${order.status}">
                    </span>
                </td>
                <td>
                    <a  class="btn btn-sm btn-outline-primary">Xem</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<div class="mt-auto" th:insert="~{layout :: footer}"></div>
</body>
</html>
