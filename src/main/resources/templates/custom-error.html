<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Error - Something went wrong</title>
    <link href="/css/index.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="/css/index.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{layout :: header}"></div>

<header class="py-5 bg-light border-bottom mb-4">
    <div class="container px-4 px-lg-5 my-5">
        <div class="text-center text-dark">
            <h1 class="display-1 fw-bolder text-danger">Oops!</h1>
            <h2 class="display-4" th:text="${status != null ? 'Error ' + status : 'An error occurred'}">404</h2>

            <p class="lead fw-normal text-muted mb-4" th:text="${errorMessage}">
                Đã có lỗi xảy ra, vui lòng thử lại sau.
            </p>

            <div class="d-flex justify-content-center gap-3">
                <a class="btn btn-dark btn-lg" th:href="@{/}">
                    <i class="bi bi-house-door"></i> Về trang chủ
                </a>
                <button class="btn btn-outline-secondary btn-lg" onclick="history.back()">
                    <i class="bi bi-arrow-left"></i> Quay lại
                </button>
            </div>
        </div>
    </div>
</header>
<footer class="mt-auto" th:insert="~{layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
