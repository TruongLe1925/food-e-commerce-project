  <!DOCTYPE html>
  <html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link href="/css/index.css" rel="stylesheet" />
    <style>
      .register-section {
          background-color: #f89d35; /* Màu cam giống ảnh của bạn */
          padding-top: 50px;
          padding-bottom: 50px;
          flex: 1; /* Đẩy footer xuống đáy */
      }
      .card-registration {
          border-radius: 15px;
          border: none;
          box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100"> <div th:insert="~{layout :: header}"></div>

  <section class="register-section d-flex align-items-center">
    <div class="container">
      <div class="row d-flex justify-content-center align-items-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-6">
          <div class="card card-registration">
            <div class="card-body p-4 p-md-5">
              <h2 class="text-uppercase text-center mb-4">Create an account</h2>

              <form th:object="${CustomerRegistrationDTO}" th:action="@{/account/save}" method="POST">

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Your Name</label>
                    <input type="text" class="form-control" th:field="*{fullName}" placeholder="Full Name"/>
                    <span th:if="${#fields.hasErrors('fullName')}"
                          th:errors="*{fullName}"
                          class="text-danger"></span><br>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Your Username</label>
                    <input type="text" class="form-control" th:field="*{username}"
                           th:classappend="${errorMessageUsername} ? 'is-invalid' : ''" placeholder="Username"/>
                    <div class="invalid-feedback" th:if="${errorMessageUsername}" th:text="${errorMessageUsername}"></div>
                    <span th:if="${#fields.hasErrors('username')}"
                          th:errors="*{username}"
                          class="text-danger"></span><br>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Your Email</label>
                    <input type="email" class="form-control" th:field="*{email}"
                           th:classappend="${errorMessageEmail} ? 'is-invalid' : ''" placeholder="Email"/>
                    <div class="invalid-feedback" th:if="${errorMessageEmail}" th:text="${errorMessageEmail}"></div>
                    <span th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}"
                          class="text-danger"></span><br>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Your Phone Number</label>
                    <input type="tel" class="form-control" th:field="*{phoneNumber}" placeholder="Phone number"/>
                    <span th:if="${#fields.hasErrors('phoneNumber')}"
                          th:errors="*{phoneNumber}"
                          class="text-danger"></span><br>
                  </div>

                </div>
                <div class="row">
                  <div class="col-12 mb-3">
                    <label class="form-label">Your Address</label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                      <input type="text" class="form-control" th:field="*{address}"
                             placeholder="Enter your street address, city, etc."/>
                    </div>
                    <span th:if="${#fields.hasErrors('address')}"
                          th:errors="*{address}"
                          class="text-danger small"></span>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" th:field="*{password}" placeholder="Password"/>
                    <span th:if="${#fields.hasErrors('password')}"
                          th:errors="*{password}"
                          class="text-danger"></span><br>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Repeat your password</label>
                    <input type="password" class="form-control" th:field="*{confirmPassword}"
                           th:classappend="${errorMessagePasswordMismatch} ? 'is-invalid' : ''" placeholder="Repeat password"/>
                    <div class="invalid-feedback" th:if="${errorMessagePasswordMismatch}" th:text="${errorMessagePasswordMismatch}"></div>
                    <span th:if="${#fields.hasErrors('confirmPassword')}"
                          th:errors="*{confirmPassword}"
                          class="text-danger"></span><br>
                  </div>
                </div>

                <div class="form-check d-flex justify-content-center mb-4 mt-2">
                  <input class="form-check-input me-2" type="checkbox" value="" id="form2Example3cg" required />
                  <label class="form-check-label" for="form2Example3cg">
                    I agree all statements in <a href="#!" class="text-body"><u>Terms of service</u></a>
                  </label>
                </div>

                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-success btn-lg text-white fw-bold">Register</button>
                </div>

                <p class="text-center text-muted mt-4 mb-0">
                  Have already an account? <a th:href="@{/account/login}" class="fw-bold text-body"><u>Login here</u></a>
                </p>
              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <div th:insert="~{layout :: footer}"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  </html>
