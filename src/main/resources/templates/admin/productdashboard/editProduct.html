<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sửa Sản Phẩm - Admin CP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .card { border-radius: 15px; border: none; }
        .preview-img { width: 100px; height: 100px; object-fit: cover; border-radius: 10px; border: 2px solid #ddd; }
    </style>
    <link href="/css/index.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">

<div th:insert="~{layout :: header}"></div>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white p-3">
                    <h5 class="mb-0 fw-bold"><i class="fas fa-edit me-2"></i>Chỉnh sửa sản phẩm: [Tên sản phẩm]</h5>
                </div>
                <form th:object="${product}" th:action="@{/admin/updateProduct}" method="POST" enctype="multipart/form-data">
                    <div class="card-body p-4">
                        <input type="hidden" name="id" value="0">

                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-bold">Tên sản phẩm</label>
                                <input type="text" th:field="*{productName}" value="Sản phẩm mẫu" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Giá bán (VNĐ)</label>
                                <input type="number" th:field="*{price}" value="100000" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Số lượng tồn kho</label>
                                <input type="number" th:field="*{stock}" value="10" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold d-block">Ảnh đại diện hiện tại</label>
                                <img th:src="@{|/images/product/${product.thumbnailUrl}|}"
                                     alt="Thumbnail" class="preview-img mb-2 shadow-sm">
                                <input type="file" name="thumbnail" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold d-block">Ảnh chi tiết hiện tại</label>
                                <img th:src="@{|/images/product/${product.imageUrl}|}"
                                     alt="Thumbnail" class="preview-img mb-2 shadow-sm">
                                <input type="file" name="image" class="form-control">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold">Mô tả sản phẩm</label>
                                <textarea th:field="*{description}" class="form-control" rows="4">Mô tả mẫu ở đây...</textarea>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-light p-3 d-flex justify-content-between">
                        <a th:href="@{/admin/product}" class="btn btn-outline-secondary px-4">Quay lại</a>
                        <input type="hidden" name="productId" th:value="${id}">
                        <button type="submit" class="btn btn-primary px-5 shadow">Lưu thay đổi</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
<div class="mt-auto" th:insert="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
