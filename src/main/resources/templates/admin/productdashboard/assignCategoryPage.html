<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gán Danh Mục - Admin CP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f4f7f6; }
    .admin-nav { background-color: #2c3e50; }
    .card { border-radius: 12px; }
    .form-check { transition: all 0.2s; border: 1px solid #dee2e6; }
    .form-check:hover { background-color: #e9ecef; border-color: #3498db; }
    .category-container { max-height: 450px; overflow-y: auto; padding-right: 5px; }
    /* Tùy chỉnh thanh cuộn */
    .category-container::-webkit-scrollbar { width: 6px; }
    .category-container::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }
  </style>
  <link href="/css/index.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">

<div th:insert="~{layout :: header}"></div>
<nav class="navbar navbar-expand-lg navbar-dark admin-nav shadow-sm py-2">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#"><i class="fas fa-shopping-bag me-2"></i>Admin CP</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a th:href="@{/admin/dashboard}" class="nav-link">Dashboard</a></li>
        <li class="nav-item"><a th:href="@{/admin/product}" class="nav-link active">Sản phẩm</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 pt-4 px-4">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-2">
              <li class="breadcrumb-item"><a th:href="@{/admin/product}">Sản phẩm</a></li>
              <li class="breadcrumb-item active">Gán danh mục</li>
            </ol>
          </nav>
          <h4 class="fw-bold text-dark">
            <i class="fas fa-tags text-info me-2"></i>
            Gán danh mục cho: <span class="text-primary" th:text="${productName}">Tên sản phẩm</span>
          </h4>
          <hr>
        </div>

        <form th:action="@{/admin/addProductToCat}" method="POST">
          <div class="card-body px-4">
            <input type="hidden" name="productId" th:value="${productId}">

            <p class="text-muted small mb-4">
              <i class="fas fa-info-circle me-1"></i>
              Chọn các danh mục mà bạn muốn áp dụng cho sản phẩm này. Bạn có thể chọn nhiều danh mục cùng lúc.
            </p>

            <div class="category-container mb-3">
              <div class="row g-3">
                <div th:each="cat : ${allCategories}" class="col-md-6">
                  <div class="form-check p-3 rounded shadow-sm d-flex align-items-center">
                    <input class="form-check-input mt-0" type="checkbox"
                           name="categoryIds"
                           th:value="${cat.id}"
                           th:id="'cat-' + ${cat.id}">
                    <label class="form-check-label flex-grow-1 ms-3 fw-medium"
                           th:for="'cat-' + ${cat.id}"
                           th:text="${cat.name}">
                      Tên danh mục
                    </label>
                  </div>
                </div>
              </div>
            </div>

            <div th:if="${#lists.isEmpty(allCategories)}" class="alert alert-warning">
              Hiện chưa có danh mục nào trong hệ thống. Hãy tạo danh mục trước.
            </div>
          </div>

          <div class="card-footer bg-light border-0 p-4 d-flex justify-content-between">
            <a th:href="@{/admin/product}" class="btn btn-outline-secondary px-4">
              <i class="fas fa-arrow-left me-2"></i>Quay lại
            </a>
            <button type="submit" class="btn btn-primary px-5 shadow-sm">
              <i class="fas fa-save me-2"></i>Lưu thay đổi
            </button>
          </div>
        </form>
      </div>

      <p class="text-center mt-4 text-muted small">
        ID Sản phẩm hiện tại: <strong th:text="${productId}">#0</strong>
      </p>
    </div>
  </div>
</main>

<div class="mt-auto" th:insert="~{layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
