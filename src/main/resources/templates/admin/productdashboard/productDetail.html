<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết Sản phẩm - Admin CP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="/css/index.css" rel="stylesheet" />
  <style>
    body { background-color: #f4f7f6; }
    .detail-card { border-radius: 15px; overflow: hidden; border: none; }
    .product-gallery img { width: 100%; border-radius: 10px; margin-bottom: 10px; border: 1px solid #eee; object-fit: cover; }
    .stats-box { background: #fff; border-left: 5px solid #3498db; border-radius: 10px; }
    .badge-category { margin-right: 5px; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">
<div th:insert="~{layout :: header}"></div>

<main class="container py-5"> <div class="row g-4">
  <div class="col-md-4">
    <div class="card detail-card shadow-sm p-3 h-100">
      <div class="product-gallery text-center">
        <label class="small text-uppercase text-muted fw-bold d-block mb-2">Ảnh chính (Thumbnail)</label>
        <img th:src="@{|/images/product/${product.thumbnailUrl}|}"
             class="img-fluid mb-4 shadow-sm" alt="Thumbnail">

        <label class="small text-uppercase text-muted fw-bold d-block mb-2">Ảnh chi tiết</label>
        <img th:src="@{|/images/product/${product.imageUrl}|}"
             class="img-fluid mb-4 shadow-sm" alt="Image">
      </div>
    </div>
  </div>

  <div class="col-md-8">
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card detail-card shadow-sm p-4 h-100">
          <h5 class="fw-bold mb-4 text-primary">
            <i class="fas fa-info-circle me-2"></i>Thông tin sản phẩm
          </h5>
          <table class="table align-middle">
            <tbody>
            <tr>
              <th class="border-0 w-25 text-muted">Mã sản phẩm:</th>
              <td class="border-0 text-primary fw-bold" th:text="${'#' + product.productId}">#000</td>
            </tr>
            <tr>
              <th class="text-muted">Tên sản phẩm:</th>
              <td class="fw-semibold" th:text="${product.productName}">Tên sản phẩm</td>
            </tr>
            <tr>
              <th class="text-muted">Danh mục:</th>
              <td>
                <span th:each="cat : ${product.categories}"
                      class="badge bg-info-subtle text-info border border-info-subtle px-3 badge-category">
                  <i class="fas fa-tag me-1" th:text="${cat.name}" ></i>
                </span>
              </td>
            </tr>
            <tr>
              <th class="text-muted">Giá hiện tại:</th>
              <td class="text-danger fw-bold fs-5"
                  th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + ' đ'}">0 đ</td>
            </tr>
              <tr>
                <th class="text-muted">Tồn kho:</th>
                <td>
                  <span th:text="${product.stock}" class="badge border px-3 text-dark"></span>
                </td>
              </tr>
            <tr>
              <th class="text-muted">Ngày tạo:</th>
              <td class="text-secondary"
                  th:text="${#temporals.format(product.createdDate, 'dd/MM/yyyy HH:mm')}">00/00/0000</td>
            </tr>
            <tr>
              <th class="text-muted">Mô tả:</th>
              <td class="text-muted small" th:text="${product.description}">Mô tả ngắn gọn về sản phẩm.</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card border-0 shadow-sm stats-box p-4 h-100">
          <div class="d-flex align-items-center mb-3">
            <div class="flex-shrink-0 bg-primary-subtle p-3 rounded-circle me-3">
              <i class="fas fa-coins fa-2x text-primary"></i>
            </div>
            <div>
              <h6 class="text-muted mb-1 text-uppercase small fw-bold">Tổng doanh thu</h6>
              <h3 class="fw-bold mb-0 text-dark"
                  th:text="${#numbers.formatDecimal(product.grossIncome, 0, 'COMMA', 0, 'POINT') + ' đ'}">0 đ</h3>
            </div>
          </div>
          <hr class="opacity-25">
          <p class="small text-muted italic">Số liệu dựa trên tất cả đơn hàng đã hoàn thành.</p>
        </div>
      </div>
    </div>

    <div class="mt-4 d-flex gap-2">
      <a th:href="@{/admin/product}" class="btn btn-outline-secondary px-4 shadow-sm">
        <i class="fas fa-arrow-left me-2"></i>Quay lại danh sách
      </a>
      <a th:href="@{/admin/product/edit/{id}(id=*{productId})}" class="btn btn-primary px-4 shadow-sm">
        <i class="fas fa-edit me-2"></i>Chỉnh sửa sản phẩm
      </a>
    </div>
  </div>
</div>
</main>

<div class="mt-auto" th:insert="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
