<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Khách hàng - Admin CP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/index.css" rel="stylesheet" />
    <style>
        body { background-color: #f4f7f6; }
        .admin-nav { background-color: #2c3e50; }
        .admin-nav .nav-link { color: rgba(255,255,255,0.8) !important; transition: 0.3s; margin: 0 5px; }
        .admin-nav .nav-link:hover, .admin-nav .nav-link.active { color: #fff !important; background: #34495e; border-radius: 5px; }

        .profile-header {
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            padding: 40px 0;
            border-radius: 10px;
            margin-bottom: -50px;
        }
        .avatar-large {
            width: 100px;
            height: 100px;
            background-color: #fff;
            color: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 2.5rem;
            font-weight: bold;
            border: 4px solid rgba(255,255,255,0.3);
        }
        .detail-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
        }
        .stat-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #e67e22;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<div th:insert="~{layout :: header}"></div>
<main class="container py-4">
    <div class="mb-4">
        <a th:href="@{/admin/customer}" class="text-decoration-none text-muted">
            <i class="fas fa-arrow-left me-1"></i> Quay lại danh sách
        </a>
    </div>

    <div class="profile-header shadow-sm px-4">
        <div class="d-flex align-items-center">
            <div class="avatar-large me-4"
                 th:text="${#strings.substring(customer.fullName, 0, 1)}">U</div>
            <div>
                <h1 class="h3 fw-bold mb-1" th:text="${customer.fullName}">Tên Khách Hàng</h1>
                <p class="mb-0 opacity-75">
                    <i class="fas fa-user-tag me-1"></i> Khách hàng thành viên
                </p>
            </div>
        </div>
    </div>

    <div class="container mt-5 pt-4">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card detail-card p-4 mb-4">
                    <h5 class="fw-bold border-bottom pb-3 mb-4">Thông tin cơ bản</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="small text-muted d-block">Email</label>
                            <span class="fw-medium" th:text="${customer.email}">email@example.com</span>
                        </div>
                        <div class="col-md-6">
                            <label class="small text-muted d-block">Số điện thoại</label>
                            <span class="fw-medium" th:text="${customer.phoneNumber}">0123456789</span>
                        </div>
                        <div class="col-12 mt-4">
                            <label class="small text-muted d-block">Địa chỉ nhận hàng</label>
                            <p class="fw-medium" th:text="${customer.address}">Địa chỉ đầy đủ...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="stat-box shadow-sm">
                    <small class="text-muted d-block text-uppercase fw-bold">Tổng chi tiêu</small>
                    <h2 class="text-primary fw-bold my-2"
                        th:text="${#numbers.formatDecimal(customer.totalExpenditure, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                        0 đ
                    </h2>
                    <p class="small text-muted mb-0">
                        <i class="fas fa-info-circle me-1"></i> Tính từ tất cả đơn hàng đã thanh toán.
                    </p>
                </div>

            </div>
        </div>
    </div>
</main>

<div class="mt-auto" th:insert="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
