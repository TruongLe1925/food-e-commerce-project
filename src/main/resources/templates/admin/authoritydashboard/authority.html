<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân quyền Manager - Admin CP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/index.css" rel="stylesheet" />
    <style>
        body { background-color: #f4f7f6; }
        .admin-nav { background-color: #2c3e50; }
        .admin-nav .nav-link { color: rgba(255,255,255,0.8) !important; transition: 0.3s; margin: 0 5px; }
        .admin-nav .nav-link:hover, .admin-nav .nav-link.active { color: #fff !important; background: #34495e; border-radius: 5px; }
        .perm-check { width: 1.2rem; height: 1.2rem; }
        .card-auth { border-top: 4px solid #3498db; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<div th:insert="~{layout :: header}"></div>

<nav class="navbar navbar-expand-lg navbar-dark admin-nav shadow-sm py-2">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="fas fa-shopping-bag me-2"></i>Admin CP</a>
        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a th:href="@{/admin/dashboard}" class="nav-link"><i class="fas fa-chart-line me-1"></i> Dashboard</a></li>
                <li class="nav-item"><a th:href="@{/admin/product}" class="nav-link"><i class="fas fa-box me-1"></i> Sản phẩm</a></li>
                <li class="nav-item"><a th:href="@{/admin/customer}" class="nav-link"><i class="fas fa-users me-1"></i> Khách hàng</a></li>
                <li class="nav-item"><a th:href="@{/admin/promotion}" class="nav-link"><i class="fas fa-tags me-1"></i> Khuyến mãi</a></li>
                <li class="nav-item"><a th:href="@{/admin/authority}" class="nav-link active"><i class="fas fa-user-shield me-1"></i> Phân quyền</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm card-auth">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3"><i class="fas fa-user-plus me-2 text-primary"></i>Tạo Manager</h5>
                    <form th:action="@{/admin/createEmployee}" th:object="${employee}"  method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Tên đăng nhập</label>
                            <input type="text" th:field="*{username}" class="form-control" placeholder="Ví dụ: manager_01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Mật khẩu</label>
                            <input type="password" th:field="*{password}" class="form-control" required>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="roles" value="ROLE_MANAGER" id="newMan" checked>
                            <label class="form-check-label small" for="newMan">Manager</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="roles" value="ROLE_ADMIN" id="newAdm">
                            <label class="form-check-label small text-danger" for="newAdm">Admin</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Tạo tài khoản</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3 border-0">
                    <h5 class="fw-bold mb-0">Quản lý Authority</h5>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr class="text-center text-uppercase small fw-bold">
                            <th class="text-start ps-4">Tài khoản Manager</th>
                            <th>Manager (MAN)</th>
                            <th>Admin (ADM)</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tbody>
                        <tr th:each="m : ${managers}">
                            <td class="ps-4">
                                <small class="text-muted fw-bold" th:text="${m.username}">username</small>
                            </td>

                            <td class="text-center">
                                <i th:if="${#lists.contains(m.authorities.![authority.name()], 'ROLE_MANAGER')}"
                                   class="fas fa-check-circle text-success fa-lg"></i>
                            </td>

                            <td class="text-center">
                                <form th:action="@{/admin/toggleAdminRole}" method="POST">
                                    <input type="hidden" name="username" th:value="${m.username}">
                                    <button type="submit" class="btn btn-link p-0 shadow-none border-0"
                                            th:title="${#lists.contains(m.authorities.![authority.name()], 'ROLE_ADMIN') ? 'Gỡ quyền Admin' : 'Cấp quyền Admin'}">

                                        <th:block th:if="${#lists.contains(m.authorities.![authority.name()], 'ROLE_ADMIN')}">
                                            <i class="fas fa-user-shield text-danger fa-lg"></i>
                                        </th:block>

                                        <th:block th:unless="${#lists.contains(m.authorities.![authority.name()], 'ROLE_ADMIN')}">
                                            <i class="fas fa-shield-alt text-secondary fa-lg" style="opacity: 0.3;"></i>
                                        </th:block>

                                    </button>
                                </form>
                            </td>

                            <td class="text-center">
                                <form th:action="@{/admin/toggleEnable}" method="POST">
                                    <input type="hidden" name="username" th:value="${m.username}">
                                    <button type="submit" class="btn btn-link p-0 text-decoration-none shadow-none">
                                    <span th:if="${m.enable}" class="badge bg-success-subtle text-success rounded-pill px-3" th:text="${m.enable}">
                                        <i class="fas fa-toggle-on me-1"></i>
                                    </span>
                                        <span th:unless="${m.enable}" class="badge bg-secondary-subtle text-secondary rounded-pill px-3">
                                            <i class="fas fa-toggle-off me-1"></i> Bị khóa
                                        </span>
                                    </button>
                                </form>
                            </td>

                            <td class="text-center">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/admin/editEmployee/{username}(username=${m.username})}" class="btn btn-outline-primary border-0">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <form th:action="@{/admin/deleteEmployee}" th:method="POST" style="display:inline;">
                                        <input type="hidden" name="username" th:value="${m.username}">
                                        <button type="submit" class="btn btn-outline-danger border-0" onclick="return confirm('Xóa manager này?')">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="mt-auto" th:insert="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
