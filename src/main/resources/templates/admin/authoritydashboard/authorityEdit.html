<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập nhật Manager - Admin CP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/index.css" rel="stylesheet" />
    <style>
        body { background-color: #f4f7f6; }
        .admin-nav { background-color: #2c3e50; }
        .admin-nav .nav-link { color: rgba(255,255,255,0.8) !important; transition: 0.3s; margin: 0 5px; }
        .admin-nav .nav-link:hover, .admin-nav .nav-link.active { color: #fff !important; background: #34495e; border-radius: 5px; }
        .card-auth { border-top: 4px solid #3498db; }
        .form-check-input:checked { background-color: #3498db; border-color: #3498db; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<div th:insert="~{layout :: header}"></div>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm card-auth">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="bg-primary-subtle d-inline-block p-3 rounded-circle mb-3">
                            <i class="fas fa-user-edit fa-2x text-primary"></i>
                        </div>
                        <h4 class="fw-bold">Cập nhật Manager</h4>
                    </div>

                    <form th:action="@{/admin/updateEmployee}" th:object="${employee}" method="POST">

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Tên đăng nhập</label>
                            <input type="text" th:field="*{username}" class="form-control bg-light" readonly>
                            <div class="form-text text-warning"><i class="fas fa-exclamation-triangle"></i> Username không thể thay đổi.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-uppercase">Mật khẩu mới</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-key text-muted"></i></span>
                                <input type="password" th:field="*{password}" class="form-control" placeholder="Để trống nếu không muốn đổi">
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-6">
                                <a th:href="@{/admin/authority}" class="btn btn-light w-100 fw-bold border">Hủy bỏ</a>
                            </div>
                            <div class="col-6">
                                <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">Lưu thay đổi</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="mt-auto" th:insert="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
