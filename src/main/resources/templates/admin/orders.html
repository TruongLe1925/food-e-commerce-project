<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng - Admin CP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .admin-nav { background-color: #2c3e50; }
        .admin-nav .nav-link { color: rgba(255,255,255,0.8) !important; transition: 0.3s; margin: 0 5px; }
        .admin-nav .nav-link:hover, .admin-nav .nav-link.active { color: #fff !important; background: #34495e; border-radius: 5px; }
    </style>
    <link href="/css/index.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">

<div th:insert="~{layout :: header}"></div>

<nav class="navbar navbar-expand-lg navbar-dark admin-nav shadow-sm py-2">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="fas fa-shopping-bag me-2"></i>Admin CP</a>
        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a th:href="@{/admin/dashboard}" class="nav-link active"><i class="fas fa-chart-line me-1"></i> Dashboard</a></li>
                <li class="nav-item"><a th:href="@{/admin/product}" class="nav-link"><i class="fas fa-box me-1"></i> Sản phẩm</a></li>
                <li class="nav-item"><a th:href="@{/admin/order active}" class="nav-link"><i class="fas fa-shopping-cart me-1"></i> Đơn hàng</a></li>
                <li class="nav-item"><a th:href="@{/admin/customer}" class="nav-link"><i class="fas fa-users me-1"></i> Khách hàng</a></li>
                <li class="nav-item"><a th:href="@{/admin/promotion}" class="nav-link"><i class="fas fa-tags me-1"></i> Khuyến mãi</a></li>
                <li class="nav-item"><a th:href="@{/admin/authority}" class="nav-link"><i class="fas fa-user-shield me-1"></i> Phân quyền</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 fw-bold text-dark mb-0">Danh sách Đơn hàng</h2>
        <div class="btn-group shadow-sm">
            <button class="btn btn-outline-secondary btn-sm active">Tất cả</button>
            <button class="btn btn-outline-secondary btn-sm">Chờ xử lý</button>
            <button class="btn btn-outline-secondary btn-sm">Hoàn thành</button>
        </div>
    </div>

    <div class="card border-0 shadow-sm overflow-hidden">
        <table class="table table-hover align-middle mb-0 text-nowrap">
            <thead class="table-light">
            <tr>
                <th class="ps-4">Mã Đơn</th>
                <th>Khách hàng</th>
                <th>Ngày đặt</th>
                <th>Tổng tiền</th>
                <th>Trạng thái</th>
                <th class="text-end pe-4">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td class="ps-4 fw-bold text-primary" th:text="${order.code}">#ORD-123</td>
                <td th:text="${order.customerName}">Nguyễn Văn A</td>
                <td th:text="${order.orderDate}">09/03/2026</td>
                <td class="fw-bold" th:text="${order.totalPrice}">1.500.000đ</td>
                <td><span class="badge rounded-pill bg-warning text-dark">Đang xử lý</span></td>
                <td class="text-end pe-4">
                    <button class="btn btn-sm btn-info text-white me-1"><i class="fas fa-eye"></i></button>
                    <button class="btn btn-sm btn-success"><i class="fas fa-check"></i></button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div class="mt-auto" th:insert="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
