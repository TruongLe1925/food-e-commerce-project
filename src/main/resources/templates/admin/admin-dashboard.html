<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/index.css" rel="stylesheet" />
    <style>
        body { background-color: #f4f7f6; }
        /* Tùy chỉnh màu sắc cho Navbar Admin */
        .admin-nav { background-color: #2c3e50; }
        .admin-nav .nav-link { color: rgba(255,255,255,0.8) !important; transition: 0.3s; margin: 0 5px; }
        .admin-nav .nav-link:hover, .admin-nav .nav-link.active { color: #fff !important; background: #34495e; border-radius: 5px; }
        .stat-card { border: none; border-radius: 15px; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .stat-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<div th:insert="~{layout :: header}"></div>

<nav class="navbar navbar-expand-lg navbar-dark admin-nav shadow-sm py-2">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">
            <i class="fas fa-shopping-bag me-2"></i>Admin CP
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a th:href="@{/admin/dashboard}" class="nav-link"><i class="fas fa-chart-line me-1"></i> Dashboard</a></li>
                <li class="nav-item"><a th:href="@{/admin/product}" class="nav-link"><i class="fas fa-box me-1"></i> Sản phẩm</a></li>
                <li class="nav-item"><a th:href="@{/admin/order}" class="nav-link"><i class="fas fa-shopping-cart me-1"></i> Đơn hàng</a></li>
                <li class="nav-item"><a th:href="@{/admin/customer}" class="nav-link"><i class="fas fa-users me-1"></i> Khách hàng</a></li>
                <li class="nav-item"><a th:href="@{/admin/promotion}" class="nav-link"><i class="fas fa-tags me-1"></i> Khuyến mãi</a></li>
                <li class="nav-item"><a th:href="@{/admin/authority}" class="nav-link"><i class="fas fa-user-shield me-1"></i> Phân quyền</a></li>
            </ul>
            <div class="dropdown">
                <button class="btn btn-outline-light dropdown-toggle border-0" data-bs-toggle="dropdown">
                    <i class="fas fa-user-circle me-1"></i> <span sec:authentication="name">Admin</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                    <li><a class="dropdown-item" href="#"><i class="fas fa-user me-2"></i>Hồ sơ</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i class="fas fa-sign-out-alt me-2"></i>Đăng xuất</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="mb-4">
        <h2 class="h4 fw-bold text-dark">Tổng quan hệ thống</h2>
        <p class="text-muted small">Chào mừng trở lại, quản trị viên.</p>
    </div>

    <div class="row g-3 mb-4 text-white">
        <div class="col-md-3">
            <div class="card stat-card bg-primary p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div><small>Doanh Thu</small><h3 class="mb-0" th:text="${adminDashboardDTO.totalRevenue}">42.5M</h3></div>
                    <i class="fas fa-dollar-sign fa-2x opacity-25"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card bg-success p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div><small>Sản Phẩm</small><h3 class="mb-0" th:text="${adminDashboardDTO.totalProducts}">1,240</h3></div>
                    <i class="fas fa-boxes fa-2x opacity-25"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card bg-warning text-dark p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div><small>Đơn Hàng</small><h3 class="mb-0" th:text="${adminDashboardDTO.totalOrders}">85</h3></div>
                    <i class="fas fa-shopping-cart fa-2x opacity-25"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card bg-info p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div><small>Người Dùng</small><h3 class="mb-0" th:text="${adminDashboardDTO.totalUsers}">412</h3></div>
                    <i class="fas fa-user-friends fa-2x opacity-25"></i>
                </div>
            </div>
        </div>
    </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm p-4 h-100">
                <h5 class="fw-bold mb-3 text-dark">Khuyến mãi active</h5>
                <div class="list-group list-group-flush">
                    <div class="list-group-item px-0 border-0 mb-2 shadow-sm rounded p-3">
                        <h6 class="mb-1 fw-bold">Summer Sale 2026</h6>
                        <span class="badge bg-primary">Giảm 20%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="mt-auto" th:insert="~{layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
