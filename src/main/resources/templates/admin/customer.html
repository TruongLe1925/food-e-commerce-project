<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Khách hàng - Admin CP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; }
        .admin-nav { background-color: #2c3e50; }
        .admin-nav .nav-link { color: rgba(255,255,255,0.8) !important; transition: 0.3s; margin: 0 5px; }
        .admin-nav .nav-link:hover, .admin-nav .nav-link.active { color: #fff !important; background: #34495e; border-radius: 5px; }
        .avatar-circle { width: 40px; height: 40px; background-color: #3498db; color: white; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; }
    </style>
    <link href="/css/index.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">

<div th:insert="~{layout :: header}"></div>

<nav class="navbar navbar-expand-lg navbar-dark admin-nav shadow-sm py-2">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="fas fa-shopping-bag me-2"></i>Admin CP</a>
        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a th:href="@{/admin/dashboard}" class="nav-link"><i class="fas fa-chart-line me-1"></i> Dashboard</a></li>
                <li class="nav-item"><a th:href="@{/admin/product}" class="nav-link"><i class="fas fa-box me-1"></i> Sản phẩm</a></li>
                <li class="nav-item"><a th:href="@{/admin/customer}" class="nav-link active"><i class="fas fa-users me-1"></i> Khách hàng</a></li>
                <li class="nav-item"><a th:href="@{/admin/promotion}" class="nav-link"><i class="fas fa-tags me-1"></i> Khuyến mãi</a></li>
                <li class="nav-item"><a th:href="@{/admin/authority}" class="nav-link"><i class="fas fa-user-shield me-1"></i> Phân quyền</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row g-3 mb-4 align-items-center">
        <div class="col-md-6">
            <h2 class="h4 fw-bold text-dark mb-0">Quản lý Khách hàng</h2>
            <p class="text-muted small mb-0">Danh sách người dùng đăng ký trên hệ thống</p>
        </div>
        <div class="col-md-6 text-md-end">
            <div class="d-inline-flex gap-2">
                <div class="bg-white px-3 py-2 rounded shadow-sm border-start border-primary border-4">
                    <small class="text-muted d-block">Tổng khách</small>
                    <span class="fw-bold" th:text="${adminDashboardDTO.totalUsers}">1,024</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm p-3">
        <div class="d-flex justify-content-between mb-3">
            <div class="input-group input-group-sm w-25">
                <input type="text" class="form-control" placeholder="Tìm email, SĐT...">
                <button class="btn btn-outline-secondary"><i class="fas fa-search"></i></button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="border-0 ps-3">Khách hàng</th>
                    <th class="border-0">Liên hệ</th>
                    <th class="border-0">Địa chỉ</th>
                    <th class="border-0">Trạng thái</th>
                    <th class="border-0 text-end pe-3">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${cus}">
                    <td class="ps-3">
                        <div class="d-flex align-items-center">
                            <div class="avatar-circle me-3" th:text="${#strings.substring(user.fullName,0,1)}">N</div>
                            <div>
                                <div class="fw-bold text-dark" th:text="${user.fullName}">Nguyễn Văn An</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="small"><i class="fas fa-envelope me-1 text-muted"></i> <span th:text="${user.email}">an.nguyen@gmail.com</span></div>
                        <div class="small"><i class="fas fa-phone me-1 text-muted"></i> <span th:text="${user.phoneNumber}">0901234567</span></div>
                    </td>

                    <td>
                        <div class="small text-muted text-wrap" style="max-width: 200px;" th:text="${user.address}">
                            123 Đường ABC, Quận 1, TP.HCM
                        </div>
                    </td>
                    <td>
                        <span class="badge bg-success-subtle text-success rounded-pill px-3" th:text="${user.enabled}">Hoạt động</span>
                    </td>
                    <td class="text-end pe-3">
                        <button class="btn btn-sm btn-light border" title="Xem lịch sử mua hàng"><i class="fas fa-history text-primary"></i></button>
                        <button class="btn btn-sm btn-light border" title="Khóa tài khoản"><i class="fas fa-user-slash text-danger"></i></button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div class="mt-auto" th:insert="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
