<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Khuyến mãi - Admin CP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="/css/index.css" rel="stylesheet" />
  <style>
    body { background-color: #f4f7f6; }
    .admin-nav { background-color: #2c3e50; }
    .admin-nav .nav-link { color: rgba(255,255,255,0.8) !important; transition: 0.3s; margin: 0 5px; }
    .admin-nav .nav-link:hover, .admin-nav .nav-link.active { color: #fff !important; background: #34495e; border-radius: 5px; }
    .promo-card { border: 2px dashed #dee2e6; transition: 0.3s; border-radius: 15px; }
    .promo-card:hover { border-color: #3498db; transform: translateY(-3px); }
    .coupon-code { letter-spacing: 2px; font-family: monospace; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

<div th:insert="~{layout :: header}"></div>

<nav class="navbar navbar-expand-lg navbar-dark admin-nav shadow-sm py-2">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#"><i class="fas fa-shopping-bag me-2"></i>Admin CP</a>
    <div class="collapse navbar-collapse" id="adminNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a th:href="@{/admin/dashboard}" class="nav-link"><i class="fas fa-chart-line me-1"></i> Dashboard</a></li>
        <li class="nav-item"><a th:href="@{/admin/product}" class="nav-link"><i class="fas fa-box me-1"></i> Sản phẩm</a></li>
        <li class="nav-item"><a th:href="@{/admin/customer}" class="nav-link"><i class="fas fa-users me-1"></i> Khách hàng</a></li>
        <li class="nav-item"><a th:href="@{/admin/promotion}" class="nav-link active"><i class="fas fa-tags me-1"></i> Khuyến mãi</a></li>
        <li class="nav-item"><a th:href="@{/admin/authority}" class="nav-link"><i class="fas fa-user-shield me-1"></i> Phân quyền</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="h4 fw-bold text-dark mb-0">Chương trình Khuyến mãi</h2>
      <p class="text-muted small">Tạo và quản lý các mã giảm giá cho khách hàng</p>
    </div>
    <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#createVoucherModal">
      <i class="fas fa-plus me-2"></i>Tạo Voucher mới
    </button>
  </div>

  <div class="row g-4">
    <div class="col-md-6 col-lg-4" th:each="promo : ${promotion}">
      <div class="card promo-card h-100 bg-white shadow-sm">
        <div class="card-body p-4 text-center">
          <div class="badge bg-primary-subtle text-primary mb-3 px-3 py-2 rounded-pill fw-bold"
               th:text="${promo.promotionName}">KHUYẾN MÃI HÈ</div>
          <h5 class="fw-bold text-dark mb-1">
            <span th:text="${#numbers.formatDecimal(promo.discountValue, 0, 'COMMA', 0, 'POINT')}">20</span>
            <span th:text="${promo.discountType.name() == 'PERCENTAGE' ? '%' : 'đ'}"> OFF</span>
          </h5>

          <p class="text-muted small mb-1">
            Bắt đầu: <span th:text="${#temporals.format(promo.startDate, 'dd/MM/yyyy')}">01/01/2026</span>
          </p>

          <div class="d-flex justify-content-center align-items-center bg-light p-2 rounded mb-3">
            <div class="small">
              <i class="far fa-calendar-alt me-1"></i>
              Hết hạn: <span th:text="${#temporals.format(promo.endDate, 'dd/MM/yyyy')}">30/06/2026</span>
            </div>
          </div>

<!--          <div class="d-flex gap-2">-->
<!--            <form th:action="@{\deletePromotion}" method="post" class="d-inline">-->
<!--              <input type="hidden" name="promotionName" th:value="${promo.promotionName}">-->
<!--              <button type="submit" class="btn btn-sm btn-outline-danger w-100"-->
<!--                      onclick="return confirm('Bạn có chắc chắn muốn xóa không?')">-->
<!--                <i class="fas fa-trash me-1"></i>Xóa-->
<!--              </button>-->
<!--            </form>-->
<!--          </div>-->
        </div>
      </div>
    </div>
  </div>
</main>
<div class="modal fade" id="createVoucherModal" tabindex="-1" aria-labelledby="createVoucherModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold" id="createVoucherModalLabel"><i class="fas fa-ticket-alt me-2"></i>Thêm Khuyến Mãi Mới</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form th:action="@{/admin/savePromotion}" th:object="${createPromotion}" method="POST">
        <div class="modal-body p-4">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-bold small text-uppercase">Tên chương trình</label>
              <input type="text" th:field="*{promotionName}" class="form-control" placeholder="Ví dụ: Giảm giá mùa Hè" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold small text-uppercase">Loại giảm giá</label>
              <select th:field="*{discountType}" class="form-select">
                <option value="PERCENTAGE">Phần trăm (%)</option>
                <option value="FIXED_AMOUNT">Số tiền cố định (VNĐ)</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold small text-uppercase">Giá trị giảm</label>
              <div class="input-group">
                <input type="number" th:field="*{discountValue}" class="form-control" placeholder="0.00" step="0.01" required>
                <span class="input-group-text"><i class="fas fa-coins"></i></span>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold small text-uppercase">Ngày bắt đầu</label>
              <input type="date" th:field="*{startDate}" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-bold small text-uppercase">Ngày kết thúc</label>
              <input type="date" th:field="*{endDate}" class="form-control" required>
            </div>
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary px-4">Lưu Voucher</button>
        </div>
      </form>
    </div>
  </div>
</div>
<div class="mt-auto" th:insert="~{layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
