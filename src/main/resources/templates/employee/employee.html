<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng - Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .order-card { border-radius: 15px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status-badge-pending { background-color: #ffc107; color: #000; }    /* Vàng */
        .status-badge-confirmed { background-color: #0dcaf0; color: #fff; }  /* Xanh biển nhạt */
        .status-badge-processing { background-color: #0d6efd; color: #fff; } /* Xanh biển đậm */
        .status-badge-completed { background-color: #198754; color: #fff; }  /* Xanh lá */
        .status-badge-cancelled { background-color: #dc3545; color: #fff; }  /* Đỏ */
    </style>
    <link href="/css/index.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
<div th:insert="~{layout :: header}"></div>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-box-open me-2"></i>Quản Lý Đơn Hàng</h2>
        <span class="badge bg-dark" >Nhân viên: <span th:text="${username}"></span></span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-danger shadow-sm">
                <i class="fas fa-sign-out-alt me-1"></i> Đăng xuất
            </button>
        </form>
    </div>

    <div class="card order-card mb-4">
        <div class="card-body">
            <ul class="nav nav-pills nav-fill">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentStatus == null} ? 'active' : ''"
                           th:href="@{/manager/orders}">Tất cả</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentStatus != null && currentStatus.name() == 'PENDING'} ? 'active' : ''"
                           th:href="@{/manager/orders(status='PENDING')}">PENDING</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentStatus != null && currentStatus.name() == 'CONFIRMED'} ? 'active' : ''"
                           th:href="@{/manager/orders(status='CONFIRMED')}">CONFIRMED</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentStatus != null && currentStatus.name() == 'PROCESSING'} ? 'active' : ''"
                           th:href="@{/manager/orders(status='PROCESSING')}">PROCESSING</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentStatus != null && currentStatus.name() == 'COMPLETED'} ? 'active' : ''"
                           th:href="@{/manager/orders(status='COMPLETED')}">COMPLETED</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${currentStatus != null && currentStatus.name() == 'CANCELLED'} ? 'active' : ''"
                           th:href="@{/manager/orders(status='CANCELLED')}">CANCELLED</a>
                    </li>
            </ul>
        </div>
    </div>

    <div class="card order-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Mã Đơn</th>
                        <th>Khách Hàng</th>
                        <th>Ngày Đặt</th>
                        <th>Tổng Tiền</th>
                        <th>Trạng Thái</th>
                        <th class="text-end pe-4">Thao Tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="orderProcess : ${orderProcessDTOS}" >
                        <td class="ps-4 fw-bold" th:text="${orderProcess.orderId}" >#ORD-8821</td>
                        <td th:text="${orderProcess.fullname}" >Nguyễn Văn A</td>
                        <td th:text="${#temporals.format(orderProcess.orderDate, 'dd/MM/yyyy')}">07/03/2026</td>
                        <td th:text="${orderProcess.totalPrice}" >1,200,000đ</td>
                        <td><span class="badge status-badge-pending" th:text="${orderProcess.status}">PENDING</span></td>
                        <td class="text-end pe-4">
                            <div class="d-flex justify-content-end align-items-center gap-2">
                                <form th:action="@{/manager/order-details}" method="GET" style="display: inline;">
                                    <input type="hidden" name="orderId" th:value="${orderProcess.orderId}">

                                    <button type="submit" class="btn btn-sm btn-light text-secondary border" title="Chi tiết">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </form>
                                <form th:action="@{/manager/update-status}" method="POST" class="m-0">
                                    <input type="hidden" name="orderId" th:value="${orderProcess.orderId}" />

                                    <div th:switch="${orderProcess.status.name()}">
                                        <button th:case="'PENDING'" type="submit" class="btn btn-sm btn-primary px-3">
                                            <i class="fas fa-check me-1"></i> Xác nhận
                                        </button>

                                        <button th:case="'CONFIRMED'" type="submit" class="btn btn-sm btn-info text-white px-3">
                                            <i class="fas fa-truck me-1"></i> Giao hàng
                                        </button>

                                        <button th:case="'PROCESSING'" type="submit" class="btn btn-sm btn-success px-3">
                                            <i class="fas fa-flag-checkered me-1"></i> Hoàn thành
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<div class="mt-auto" th:insert="~{layout :: footer}"></div>
</body>
</html>
