<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Shop Homepage - Start Bootstrap Template</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="/css/index.css" rel="stylesheet" />
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light" th:fragment="header">
    <div class="container px-4 px-lg-5">
        <a class="navbar-brand" th:href="@{/}">Start Bootstrap</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link active" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#!">About</a></li>
<!--                <li class="nav-item dropdown">-->
<!--                    <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Shop</a>-->
<!--                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">-->
<!--                        <li><a class="dropdown-item" href="#!">All Products</a></li>-->
<!--                        <li><hr class="dropdown-divider" /></li>-->
<!--                        <li><a class="dropdown-item" href="#!">Popular Items</a></li>-->
<!--                        <li><a class="dropdown-item" href="#!">New Arrivals</a></li>-->
<!--                    </ul>-->
<!--                </li>-->
            </ul>
            <form class="d-flex">
                <div sec:authorize="hasRole('CUSTOMER')" class="ms-2">
                    <a th:href="@{/cart/showCart}" class="btn btn-outline-dark d-flex align-items-center">
                        <i class="bi-cart-fill me-1"></i>
                        <span>Cart</span>
                        <span class="badge bg-dark text-white ms-1 rounded-pill"></span>
                    </a>
                </div>

                <div sec:authorize="hasRole('CUSTOMER')" class="ms-2">
                    <a class="btn btn-outline-dark d-flex align-items-center" th:href="@{/cus/customerdetail}">
                        <i class="bi-person-fill"></i>
                    </a>
                </div>
                <div sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/dashboard}" class="btn btn-outline-danger ms-2">
                        <i class="bi bi-shield-lock"></i> Admin Panel
                    </a>
                </div>

                <div sec:authorize="hasRole('MANAGER')">
                    <a th:href="@{/manager/orders}" class="btn btn-outline-info ms-2">
                        <i class="bi bi-kanban"></i> Manager Portal
                    </a>
                </div>
                <div sec:authorize="isAnonymous()" class="d-flex align-items-center">
                    <p class="mb-0">
                        <a class="btn btn-outline-dark ms-2" th:href="@{/account/login}">
                            <i class="bi-box-arrow-in-right"></i> Login
                        </a>
                    </p>
                    <p class="mb-0">
                        <a class="btn btn-outline-dark ms-2" th:href="@{/account/register}" target="_blank">
                            <i class="bi bi-person-plus"></i> Register
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</nav>

<main>
    <div th:replace="${content}">
    </div>
</main>

<footer class="py-5 bg-dark" th:fragment="footer">
    <div class="container">
        <p class="m-0 text-center text-white">Copyright &copy; Your Website 2023</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/scripts.js"></script>
</body>
</html>
